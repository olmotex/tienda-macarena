# Publica las reglas de seguridad en Firebase cada vez que cambia firestore.rules.
# Necesita el secreto FIREBASE_SERVICE_ACCOUNT (la clave JSON de una cuenta de servicio del proyecto).
name: Publicar reglas de Firebase
on:
  push:
    branches: [main]
    paths: [firestore.rules, firebase.json, .github/workflows/firebase-rules.yml]
  workflow_dispatch:
jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Publicar firestore.rules
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "Falta el secreto FIREBASE_SERVICE_ACCOUNT"; exit 1; fi
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@13.29.1 deploy --only firestore:rules --project tienda-macarena --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
